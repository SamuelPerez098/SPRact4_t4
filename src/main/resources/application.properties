# Puerto de la Actividad 4 (Act1=8081, Act2=8083, Act3=8084)
server.port=${PORT:8085}

# Base de datos PostgreSQL (en el VPS se sobreescribe con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/act4_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}

# JPA / Hibernate: "update" conserva los datos entre reinicios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: en el VPS define JWT_SECRET con una clave propia de al menos 32 caracteres
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiala-en-el-vps-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Paginación: tamaño máximo de página permitido
spring.data.web.pageable.max-page-size=50
